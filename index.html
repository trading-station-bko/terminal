<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Terminal Privé - Dolo & Frères</title>
    <style>
        /* DESIGN DU TERMINAL */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        header { 
            background-color: #161b22; padding: 10px 20px; border-bottom: 1px solid #30363d; 
            display: flex; justify-content: space-between; align-items: center; 
        }

        .dashboard { 
            display: grid; grid-template-columns: 1fr 350px; height: calc(100vh - 50px); 
            gap: 5px; padding: 5px; transition: all 0.3s ease;
        }

        .dashboard.fullscreen { grid-template-columns: 1fr 0px; gap: 0; }
        .main-chart { background: #161b22; border: 1px solid #30363d; border-radius: 4px; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar { display: grid; grid-template-rows: auto 1fr 1fr; gap: 5px; overflow-y: auto; }
        .dashboard.fullscreen .sidebar { display: none; }
        
        .widget-box { background: #161b22; border: 1px solid #30363d; border-radius: 4px; overflow: hidden; position: relative; }
        
        .widget-box.zoom-active { 
            position: fixed; top: 50px; left: 0; width: 100vw; height: calc(100vh - 50px); z-index: 9999; 
            background: #0d1117;
        }

        .widget-title { 
            background: #21262d; padding: 8px 10px; font-size: 11px; text-transform: uppercase; 
            border-bottom: 1px solid #30363d; color: #58a6ff; 
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .btn-zoom { background: #30363d; color: #58a6ff; border: 1px solid #444; padding: 2px 8px; cursor: pointer; border-radius: 3px; font-size: 10px; }
        .nav-btns { background: #161b22; padding: 8px; border-bottom: 1px solid #30363d; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-sym { background: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .btn-toggle { background: #238636; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-left: auto; }

        input { width: 100%; background: #0d1117; color: white; border: 1px solid #30363d; padding: 10px; margin-bottom: 8px; border-radius: 3px; font-size: 14px; }
        .calc-btn { background: #238636; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        .save-btn { background: #30363d; color: #c9d1d9; border: 1px solid #444; padding: 8px; cursor: pointer; border-radius: 4px; font-size: 11px; width: 48%; margin-top: 10px; }
    </style>
</head>
<body>

<div id="auth-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #131722; color: white;">
    <h2>Connexion Trading Terminal</h2>
    <div style="width: 300px;">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <div style="display: flex; gap: 10px;">
            <button onclick="window.handleLogin()" style="flex: 1; padding: 12px; background: #2962ff; color: white; border: none; cursor: pointer; border-radius: 4px;">Se connecter</button>
            <button onclick="window.handleSignUp()" style="flex: 1; padding: 12px; background: #4caf50; color: white; border: none; cursor: pointer; border-radius: 4px;">S'inscrire</button>
        </div>
    </div>
</div>

<div id="main-terminal" style="display: none;">
    <header>
        <div style="font-weight: bold; color: #58a6ff;">DOLO TRADING TERMINAL v1.5</div>
        <button onclick="window.handleLogout()" style="background: transparent; color: #f85149; border: 1px solid #f85149; padding: 4px 8px; cursor: pointer; border-radius: 4px; font-size: 12px;">Déconnexion</button>
    </header>

    <div class="dashboard" id="mainDashboard">
        <div class="main-chart">
            <div class="nav-btns">
                <button class="btn-sym" onclick="changeSymbol('FX:EURUSD')">EUR/USD</button>
                <button class="btn-sym" onclick="changeSymbol('FX:GBPUSD')">GBP/USD</button>
                <button class="btn-sym" onclick="changeSymbol('OANDA:XAUUSD')">OR (GOLD)</button>
                <button class="btn-sym" onclick="changeSymbol('OANDA:XAGUSD')">ARGENT (SILVER)</button>
                <button class="btn-sym" onclick="changeSymbol('OANDA:NAS100USD')">NAS100</button>
                <button class="btn-sym" onclick="changeSymbol('BINANCE:BTCUSDT')">BITCOIN</button>
                <button class="btn-toggle" id="toggleBtn" onclick="toggleFullChart()">PLEIN ÉCRAN</button>
            </div>
            <div id="tradingview_chart" style="flex-grow: 1; width: 100%;"></div>
        </div>

        <div class="sidebar">
           <div style="padding: 10px;">
                <label style="font-size: 11px; color: #58a6ff;">Capital ($) :</label>
                <input type="number" id="balance" value="1000">
                <label style="font-size: 11px; color: #58a6ff;">Risque (%) :</label>
                <input type="number" id="risk" value="1">
                <label style="font-size: 11px; color: #58a6ff;">Stop Loss (Pips) :</label>
                <input type="number" id="sl" value="20">
                <button class="calc-btn" onclick="lancerCalculEtSauve()">CALCULER & SAUVER</button>
                <div id="result" style="margin-top: 10px; color: #58a6ff; font-weight: bold; text-align: center; font-size: 18px;">Lot : 0.00</div>
            </div>

            <div class="widget-box" id="price-box">
                <div class="widget-title">Prix</div>
                <div style="height: 300px;" id="widget-market"></div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<script type="module">
  // 1. Imports des bibliothèques Google
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // 2. Ta configuration personnelle (NE PAS CHANGER)
  const firebaseConfig = {
    apiKey: "AIzaSyDcQYVYiZ0QrvuXrAkjFhROBRfAcVNiZRU",
    authDomain: "dolo-trading-terminal.firebaseapp.com",
    projectId: "dolo-trading-terminal",
    storageBucket: "dolo-trading-terminal.firebasestorage.app",
    messagingSenderId: "262978311881",
    appId: "1:262978311881:web:c6a7479d181de2d46a5f18"
  };

  // 3. Initialisation de Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // --- 4. LES FONCTIONS DE CONNEXION (Rendues Publiques) ---

  window.handleLogin = async function() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    if (!email || !pass) { alert("Remplis tous les champs"); return; }
    try { 
      await signInWithEmailAndPassword(auth, email, pass); 
    } catch (e) { alert("Erreur de connexion : " + e.message); }
  };

  window.handleSignUp = async function() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    if (pass.length < 6) { alert("Le mot de passe doit faire 6 caractères minimum"); return; }
    try { 
      await createUserWithEmailAndPassword(auth, email, pass);
      alert("Compte créé avec succès !");
    } catch (e) { alert("Erreur d'inscription : " + e.message); }
  };

  window.handleLogout = function() {
    signOut(auth);
  };

  // 5. Surveillance de l'état de connexion (Affiche/Cache le terminal)
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-terminal').style.display = 'block';
      // On lance le graphique seulement quand on est connecté
      new TradingView.widget({
        "width": "100%", "height": "100%", "symbol": "FX:EURUSD",
        "interval": "D", "timezone": "Etc/UTC", "theme": "dark",
        "style": "1", "locale": "fr", "toolbar_bg": "#f1f3f6",
        "enable_publishing": false, "allow_symbol_change": true,
        "container_id": "tradingview_chart"
      });
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('main-terminal').style.display = 'none';
    }
  });

  // 6. Fonction pour Sauvegarder
  window.lancerCalculEtSauve = async function() {
    const capital = document.getElementById('balance').value;
    const risque = document.getElementById('risk').value;
    const sl = document.getElementById('sl').value;
    const lot = (capital * (risque/100)) / (sl * 10);
    document.getElementById('result').innerText = "Lot : " + lot.toFixed(2);

    const user = auth.currentUser;
    if (user) {
      try {
        await addDoc(collection(db, "analyses"), {
          capital: capital,
          risque: risque,
          sl: sl,
          lot: lot.toFixed(2),
          userId: user.uid,
          timestamp: new Date()
        });
        alert("Analyse sauvegardée dans ton espace privé !");
      } catch (e) { alert("Erreur de sauvegarde : " + e.message); }
    }
  };
</script>
</body>
</html>
